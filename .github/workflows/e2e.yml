name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build backend binary
        run: go build -o /tmp/omc ./cmd/server

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start server (fake keys + temp DB/DATA_DIR)
        env:
          # 假 key 即可启动：config.Load 只校验 key 非空、不验证真伪。
          # E2E 只覆盖不触发 AI 的路径，绝不会真的调用付费 LLM API。
          DASHSCOPE_API_KEY: sk-test
          ARK_API_KEY: ark-test
          DB_PATH: /tmp/e2e.db
          DATA_DIR: /tmp/e2e_data
          PORT: "8080"
          WEB_DIST: web/dist
          # 播种 admin + 放行邀请码注册（假值），E2E 才能走通注册→登录→改昵称。
          INVITE_CODE: welcome123
          # E2E 多个 spec 共用一个 server 和同一个邀请码注册多次；关闭名额限制
          # （0=不限），使 E2E 与邀请码限额解耦——限额本身由单测/契约测试覆盖。
          INVITE_MAX_USES: "0"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: Passw0rd1
        run: |
          /tmp/omc &
          echo "server_pid=$!" >> "$GITHUB_ENV"
          # 轮询健康检查，最多等 30s。
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/health || true)
            if [ "$code" = "200" ]; then
              echo "health OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in time" >&2
          exit 1

      - name: Run E2E tests
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results/
          retention-days: 7
